#cloud-config
# SSE RESEARCH EXAMPLE ONLY — edit all REPLACE_... fields before deploying.
# Installs only the read-only role heartbeat; NO blockchain signing or joining.
# Operator must independently approve a complete Git commit SHA in advance.
package_update: true
packages:
  - git
  - curl
  - ca-certificates
  - python3
  - python3-venv

write_files:
  - path: /usr/local/sbin/sse-firstboot-launch.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      APPROVED_SHA='REPLACE_WITH_EXTERNAL_APPROVED_40_HEX_GIT_COMMIT'
      NODE_ID='provider-vm-01'
      ROLES='provider'
      CHAIN_ID='11155111'
      RPC_URL='https://REPLACE_WITH_PUBLIC_TESTNET_RPC_WITHOUT_SECRETS'
      SSE_SETTLEMENT='0xREPLACE_WITH_DEPLOYED_SETTLEMENT_ADDRESS'
      [[ "$APPROVED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid approved Git SHA' >&2; exit 1; }
      [[ "$SSE_SETTLEMENT" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo 'Invalid deployed address' >&2; exit 1; }
      curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
        "https://raw.githubusercontent.com/AkrAyoub/sse-research/$APPROVED_SHA/tools/sse_vm_bootstrap.py" \
        --output /run/sse_vm_bootstrap.py
      python3 /run/sse_vm_bootstrap.py \
        --revision "$APPROVED_SHA" --node-id "$NODE_ID" --roles "$ROLES" \
        --rpc-url "$RPC_URL" --chain-id "$CHAIN_ID" --settlement "$SSE_SETTLEMENT" \
        --apply
runcmd:
  - ["/usr/local/sbin/sse-firstboot-launch.sh"]
