name: WP16 distinct agent process fault experiments
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  local-process-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install pinned research dependencies and compile V2
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          bash scripts/install-contract-deps.sh
          forge build
          python -m compileall -q scripts services tools
      - name: Run separate provider, monitor and consumer OS processes
        shell: bash
        run: |
          set -euo pipefail
          anvil --host 127.0.0.1 --port 8545 --chain-id 31337 --accounts 12 \
            --mnemonic 'test test test test test test test test test test test junk' \
            > "${RUNNER_TEMP}/wp16-anvil-private-lab.log" 2>&1 &
          ANVIL_PID=$!
          trap 'kill "${ANVIL_PID}" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          python scripts/wp16_multiprocess_fault_lab.py \
            --rpc-url http://127.0.0.1:8545 \
            --output "${RUNNER_TEMP}/wp16-multiprocess-faults.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp16-local-process-fault-trace
          path: ${{ runner.temp }}/wp16-multiprocess-faults.json
          if-no-files-found: warn
          retention-days: 14
