name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q apps services tools tests
      # Includes subprocess --help smoke for the previously broken signed monitor.
      - run: python -m unittest discover -s tests -v
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: bash scripts/install-contract-deps.sh
      - run: forge build
      - run: forge test -vv
