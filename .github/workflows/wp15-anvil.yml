name: WP15 real Anvil V2 evidence integration
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  anvil-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install deterministic lab dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          bash scripts/install-contract-deps.sh
          forge build
      - name: Execute real Anvil HTTP and archive integration
        shell: bash
        run: |
          set -euo pipefail
          anvil --host 127.0.0.1 --port 8545 --chain-id 31337 --accounts 12 \
            --mnemonic 'test test test test test test test test test test test junk' \
            > "${RUNNER_TEMP}/wp15-anvil.log" 2>&1 &
          ANVIL_PID=$!
          trap 'kill "${ANVIL_PID}" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if cast chain-id --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1; then break; fi
            sleep 0.25
          done
          python scripts/wp15_anvil_v2_e2e.py \
            --rpc-url http://127.0.0.1:8545 \
            --output "${RUNNER_TEMP}/wp15-anvil-v2-trace.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wp15-real-anvil-v2-trace
          # Only upload the sanitized evidence/receipt trace. Anvil startup
          # logs can contain public test private keys even on a lab chain.
          path: ${{ runner.temp }}/wp15-anvil-v2-trace.json
          if-no-files-found: warn
          retention-days: 14
