name: SSE private lab read-only chain checkpoint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sse-lab-readonly-check
  cancel-in-progress: false

jobs:
  inspect-preserved-chain:
    name: Inspect chain 31337 (never sign or send)
    # Not runnable on GitHub-hosted runners: 10.50.56.x is private.
    # This label must be assigned ONLY to a separately reviewed, key-free
    # read-only runner with access to controller-local loopback RPC.
    runs-on: [self-hosted, linux, sse-lab-readonly]
    environment: sse-lab-readonly
    timeout-minutes: 5
    steps:
      - name: Verify chain and preserved transactions (read-only)
        shell: bash
        run: |
          set -euo pipefail
          RPC=http://127.0.0.1:8545
          CAST="$HOME/.foundry/bin/cast"
          test -x "$CAST"
          test "$("$CAST" chain-id --rpc-url "$RPC")" = "31337"
          echo "chainId=31337"
          echo "block=$("$CAST" block-number --rpc-url "$RPC")"

          BOARD=0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0
          POOL=0x5FbDB2315678afecb367f032d93F642f64180aa3
          SETTLEMENT=0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512

          for contract in "$BOARD" "$POOL" "$SETTLEMENT"; do
            code=$("$CAST" code "$contract" --rpc-url "$RPC")
            test "$code" != "0x"
            test -n "$code"
          done
          echo "contracts=present"

          FUND=0x013c7a1717e08473aa0c20f18cc83d26a2050aeea3da9a953b5e942c6ff39aa1
          ACCEPT=0x15f0331a3a9ebeb22df7450452e6756b45dd08ac27955d64902fb19e2486f648
          for tx in "$FUND" "$ACCEPT"; do
            status=$("$CAST" receipt "$tx" status --rpc-url "$RPC")
            test "$status" = "1"
          done
          echo "funding_receipt=success"
          echo "acceptance_receipt=success"

          echo "leaseNext=$("$CAST" call "$SETTLEMENT" 'nextLeaseId()(uint256)' --rpc-url "$RPC" | awk '{print $1}')"
          echo "assignment1Status=$("$CAST" call "$POOL" 'assignmentStatus(uint256)(uint8)' 1 --rpc-url "$RPC" | awk '{print $1}')"
          echo "snapshot1Size=$("$CAST" call "$POOL" 'snapshotSize(uint256)(uint256)' 1 --rpc-url "$RPC" | awk '{print $1}')"
          echo "assignment1RequestedAt=$("$CAST" call "$POOL" 'assignmentRequestedAt(uint256)(uint64)' 1 --rpc-url "$RPC" | awk '{print $1}')"
          echo "randomnessTimeout=$("$CAST" call "$POOL" 'randomnessTimeout()(uint64)' --rpc-url "$RPC" | awk '{print $1}')"
          echo "latestChainTimestamp=$("$CAST" block latest --field timestamp --rpc-url "$RPC")"
          echo "No mined blocks or contract writes were requested by this workflow."
