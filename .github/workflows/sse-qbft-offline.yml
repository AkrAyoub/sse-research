name: SSE QBFT safe offline verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sse-qbft-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-validation:
    name: Validate SSH discovery and QBFT generator (no RPC or keys)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact GitHub revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Reviewed GitHub source; do not follow mutable deployment state.
          ref: 4e9b3d7e9393e8384cb82032b128fadb23f2a339

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm source syntax
        run: python -m py_compile tools/sse_qbft_lab_config.py tools/sse_ssh_identity_tunnel.py tests/test_sse_qbft_lab_config.py tests/test_sse_ssh_identity_tunnel.py

      - name: Execute QBFT config tests
        run: python -m unittest discover -s tests -p 'test_sse_qbft_lab_config.py' -v

      - name: Execute SSH identity discovery tests
        run: python -m unittest discover -s tests -p 'test_sse_ssh_identity_tunnel.py' -v

      - name: Generate isolated non-deployable sample artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sse-qbft-demo"
          chmod 700 "${RUNNER_TEMP}/sse-qbft-demo"
          python tools/sse_qbft_lab_config.py \
            --out-dir "${RUNNER_TEMP}/sse-qbft-demo" \
            --chain-id 31338 \
            --block-period 5 --gas-limit 15000000 \
            --validator 0x1111111111111111111111111111111111111111 \
            --validator 0x2222222222222222222222222222222222222222 \
            --validator 0x3333333333333333333333333333333333333333 \
            --validator 0x4444444444444444444444444444444444444444
          python -c "import json,os;from pathlib import Path;p=Path(os.environ['RUNNER_TEMP'])/'sse-qbft-demo'/'genesis.json';d=json.loads(p.read_text());assert d['config']['chainId']==31338;assert len(bytes.fromhex(d['extraData'][2:]))==124;print('OFFLINE_GENESIS_SCHEMA_OK')"
          printf '%s\n' 'SYNTHETIC PUBLIC ADDRESSES ONLY. THIS IS NOT A DEPLOYABLE VALIDATOR NETWORK.' > "${RUNNER_TEMP}/sse-qbft-demo/NOT-DEPLOYABLE.txt"
          sha256sum "${RUNNER_TEMP}/sse-qbft-demo/"* > "${RUNNER_TEMP}/sse-qbft-demo/SHA256SUMS"

      - name: Save reproducibility artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: sse-qbft-synthetic-offline-demo
          path: ${{ runner.temp }}/sse-qbft-demo/
          if-no-files-found: error
          retention-days: 7
